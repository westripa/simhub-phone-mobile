name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: bash -n scripts/build-pjsip-android.sh

  android-build:
    name: Build Android APK (arm64-v8a)
    needs: flutter-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK 28 & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Cache PJSIP native build
        id: cache-pjsip
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/*.so
            android/app/src/main/java/org/pjsip/pjsua2
          key: pjsip-2.17-openssl-3.0.16-ndk-28.2.13676358-arm64-${{ hashFiles('scripts/build-pjsip-android.sh') }}
      - name: Build PJSIP 2.17 + OpenSSL 3.0.16 from source
        if: steps.cache-pjsip.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./scripts/build-pjsip-android.sh --abis arm64-v8a --sync-java
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64 -PabiFilters=arm64-v8a
